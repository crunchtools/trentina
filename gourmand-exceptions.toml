# --- document transforms: structural similarity, not copied code ---
# All three are short, generic shapes that any two independent
# implementations converge on. The old justification here argued that
# scanview/ had to stay a sibling of transforms/ and so must be free to
# diverge; #167 removed that premise -- there is one role now. The exceptions
# survive it because none of them rested on the split: each is a coincidence
# of shape between functions that share no domain, types or caller.

