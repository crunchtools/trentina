justification = "_resolve_upstream (resolve the upstream, grant and path, or refuse) is reported similar to quarantine/agent._parse_openrouter_search and unpack/scan._data_uri. All three are a short guard-then-return chain; they share that skeleton and nothing else. A structural collision, as with transforms/petit.py."
