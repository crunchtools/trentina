path = "src/trentina/l1/pipeline.py"
justification = "_run_stages is reported as identical to normalize_unicode in l1/unicode.py. The shared shape is the pipeline's own idiom -- a run of `view, stats.x = stage(view)` assignments -- which is what running a sequence of stages looks like and is the reason the two paths were collapsed into one in #172. normalize_unicode threads its own NFKC passes the same way. Structural collision between a loop-free pipeline and a loop-free transform, not duplication."
classification = "gourmand_bug"

[[exceptions]]
