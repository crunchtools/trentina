justification = "The word DEPRECATED appears inside a sample STRING that exercises the notice regex, not as a tombstone over removed code. This file's whole job is to detect deprecation notices whose named release has already shipped, so it has to contain examples of how they are spelled -- including the capitalised form, whose absence from the pattern hid eight live notices until 0.29.0."
