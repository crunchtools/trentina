# `pre-commit install` wires all three stages. Without this it wires only
# pre-commit, so the push tier would never run and nobody would notice.
default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]

repos:
  # ruff runs from its own pre-commit environment, not a host install
  # (constitution XII, host contract). Keep rev at the ruff version in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        files: \.py$
        stages: [pre-commit, pre-merge-commit]
      - id: ruff-format
        args: [--check]
        files: \.py$
        stages: [pre-commit, pre-merge-commit]
      # CI lints `src tests corpora` whole; the hook above lints only what you
      # staged, so an error in a file you did not touch still reaches CI. No
      # --fix here on purpose: a whole-tree fix rewrites files outside the
      # commit and fights pre-commit's stash of your unstaged work.
      - id: ruff-check
        alias: ruff-check-all
        name: ruff check (src tests corpora, as CI runs it)
        args: [src, tests, corpora]
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
  # mypy needs the project's locked dependencies, so it runs `uv` from the uv
  # image instead of a host install. The named volume keeps the environment and
  # the mypy cache between runs; the repo is mounted read-only.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: podman --events-backend=none run --rm --log-driver=none -v .:/src:ro,Z -w /src -v crunchtools-hook-cache:/cache -e UV_CACHE_DIR=/cache/uv -e UV_PROJECT_ENVIRONMENT=/cache/venv/trentina ghcr.io/astral-sh/uv:python3.12-bookworm-slim uv run --locked --all-extras mypy --cache-dir /cache/mypy/trentina src
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-merge-commit]

  # Gourmand runs from its container: the PyPI package of the same name
  # shadows the real binary on PATH, so a bare `gourmand` is the wrong tool.
  - repo: local
    hooks:
      - id: gourmand
        name: Gourmand (AI slop detection)
        entry: podman --events-backend=none run --rm --log-driver=none -v .:/src:Z -w /src quay.io/crunchtools/gourmand:latest check --full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
      # Constitution XII (v1.17.0): reviews the STAGED diff from the image CI
      # runs, with the repo mounted read-only so its Constitution agent reads
      # ours. Blocks on critical/high. SKIP=gatehouse for a false positive —
      # then answer the same finding on the PR.
      - id: gatehouse
        name: Gatehouse (AI code review, staged diff)
        entry: bash -c 'git diff --cached | podman --events-backend=none run --rm --log-driver=none -i --env-file "$HOME/.config/mcp-env/gatehouse.env" -v .:/src:ro,Z -w /src quay.io/crunchtools/gatehouse:latest --stdin'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]

  # XII host contract: a repo script, so no gate assumes uv, pytest or semgrep
  # on the host. Every one of them runs from a container image.
  - repo: local
    hooks:
      - id: gates-hooks-installed
        name: pre-push gates are installed
        entry: ./scripts/gates.sh hooks-installed
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]

      - id: pytest-container
        name: pytest (full suite, containerised)
        entry: ./scripts/gates.sh pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: semgrep
        name: Semgrep (rule tests + scan src)
        entry: ./scripts/gates.sh semgrep
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Closes the gap that let CI findings arrive after the local hook went
      # green: the pre-commit Gatehouse sees ONE staged diff, so nothing
      # reviewed the branch as a whole. This reviews origin/main...HEAD.
      - id: gatehouse-range
        name: Gatehouse (AI review, cumulative branch diff)
        entry: ./scripts/gates.sh gatehouse-range
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
