# Gatehouse findings already judged. An entry applies while the code it quotes
# is still present, and is reported stale once that code is gone.

[[findings]]
agent = "constitution"
category = "constitution"
file = "src/trentina/tools/enrol.py"
evidence = "\"code\": code,"
status = "not-a-bug"
reason = "The enrolment code is not the approval capability: it only authorises creating the FIRST approver during an operator-opened window in which every staged decision is already refused (Human Approval requirement 3). The capability that approves, the passkey or password a person then sets, is never returned by any tool. Returning the code to the agent is deliberate since #637 (approver.open_enrolment docstring; docs/approvals.md 'Keep code execution off the operator profile'); #639 moves it into a URL fragment and changes nothing about who holds it. cto ruling 2026-11-04."

[[findings]]
agent = "consistency"
category = "quality"
file = "src/trentina/gateway/approval_routes.py"
evidence = "{\"ok\": False, \"message\": str(exc)}, HTTPStatus.BAD_REQUEST, headers=_HEADERS"
status = "not-a-bug"
reason = "Registration's specific messages are returned only after _registration_binding has authorised the registrant (fresh session with CSRF, or the live enrolment code); every unauthenticated failure still gets the shared _NOTHING_JSON answer. The ApproverError texts are constant strings that echo nothing submitted, so an authorised person learns why their own enrolment failed and a stranger learns nothing. cto ruling 2026-11-04."

[[findings]]
agent = "general"
category = "quality"
file = "src/trentina/transports/registry.py"
evidence = "def _table() -> dict[str, Transport]:\n    if \"mcp\" not in _TRANSPORTS:\n        importlib.import_module(\"trentina.gateway\")\n        from .mcp import mcp_transport"
status = "not-a-bug"
reason = "Deliberate cycle break (#535 R4): the mcp transport and the gateway package import each other, and importing the registry before the gateway cycled on main too. Seeding on first use, after the gateway has loaded as it has on every serving path, is what lets the registry be imported alone (route plugins reach it); an explicit init step would add a second way to get an unseeded table."

[[findings]]
agent = "constitution"
category = "constitution"
file = "src/trentina/quarantine/l3_cache.py"
evidence = "if hit is not None and time.monotonic() - hit[0] < TTL_SECONDS:\n    _verdicts.move_to_end(key)\n    l3_counts[\"shared\"] += 1\n    return copy.deepcopy(hit[1])"
status = "not-a-bug"
reason = "No layer is switched off: L1 and L2 run on every request, and L3's verdict is reused only for byte-identical content AND briefing under an identical judge (provider, model, prompt pack, effort, fallback chain), so it is the judgement L3 made of those exact bytes, read once, which is the Layer Contract's own 'each layer reads once'. The perimeter verdict cache (gateway/verdict_cache.py, #120) has served whole L1/L2/L3 verdicts for identical descriptions and responses on the same basis without a federation declaration. An unavailable or failed L3 is never kept. The constitution should say verdict caches out loud; raised with Scott. Ruling for a173 (Josui Prime brief, 2026-11-17)."

[[findings]]
agent = "bugs"
category = "bug"
file = "src/trentina/gateway/request_units.py"
evidence = "```python\nmessages.extend(json.dumps(item, ensure_ascii=False) for item in value)\nframe[name] = []\nreturn [f\"{head}\\n{json.dumps(frame, ensure_ascii=False)}\", *messages]\n```"
status = "not-a-bug"
reason = "Deliberate (a341). Judging the whole request was not a context-aware check in practice: any conversation over the 32K-token admission cap had only its head read, and in a Gatehouse burst 14 of 18 requests were read by nothing at all before the 20 s deadline. Per-message units are how a paged response is already judged (gateway/paging.py, each part whole under the cap), and the split-instruction tradeoff is stated in docs/llm-proxying.md."

[[findings]]
agent = "security"
category = "security"
file = "src/trentina/gateway/request_units.py"
evidence = "for name in CONVERSATION_FIELDS:\n    value = frame.get(name)\n    if isinstance(value, list):\n        messages.extend(json.dumps(item, ensure_ascii=False) for item in value)\n        frame[name] = []\nreturn [f\"{head}\\n{json.dumps(frame, ensure_ascii=False)}\", *messages]"
status = "not-a-bug"
reason = "Deliberate (a341). The whole-request judgement this replaces read only the first 32K tokens of a longer conversation and, under burst load, timed out unjudged for most requests (373 in two hours on dolza-max). Each message is now read whole by L1/L2/L3, the same per-part judging paging already applies to responses; an instruction split across two messages is the stated tradeoff in docs/llm-proxying.md."
