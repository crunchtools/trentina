[[findings]]
agent = "bugs"
category = "bug"
file = "src/trentina/gateway/request_units.py"
evidence = "```python\nmessages.extend(json.dumps(item, ensure_ascii=False) for item in value)\nframe[name] = []\nreturn [f\"{head}\\n{json.dumps(frame, ensure_ascii=False)}\", *messages]\n```"
status = "not-a-bug"
reason = "Deliberate (a341). Judging the whole request was not a context-aware check in practice: any conversation over the 32K-token admission cap had only its head read, and in a Gatehouse burst 14 of 18 requests were read by nothing at all before the 20 s deadline. Per-message units are how a paged response is already judged (gateway/paging.py, each part whole under the cap), and the split-instruction tradeoff is stated in docs/llm-proxying.md."

