# Canonical Dependabot config for crunchtools Python projects using uv.
# Drop in as .github/dependabot.yml. See constitution.md Section XV.
#
# Covers both ecosystems that go stale silently if left unpinned:
#   - uv:            uv.lock (must be committed, never gitignored)
#   - github-actions: `uses: some-action@vX.Y.Z` pins in .github/workflows/

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Fleet policy (constitution XV.3): nothing under 7 days old.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Fleet policy (constitution XV.3): nothing under 7 days old.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"

  # scripts/l2-pod-requirements.txt pins what the RunPod GPU image installs to
  # train the L2 model. It was covered by security updates only (that is how
  # transformers' five open advisories reached us as #547 while routine
  # versions never did), so it is declared here like any other ecosystem
  # present in the repo (XV.2). Majors wait for a human: a bump here is proved
  # by the next training round, whose recorded gates a new model must pass.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    # Fleet policy (constitution XV.3): nothing under 7 days old.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The Containerfiles' FROM lines are pinned by digest (XV.2). This entry
  # proposes each new base digest as a pull request, gated like any other
  # change, so the weekly rebuild never picks up a base nobody reviewed.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.oss-scanner"
    schedule:
      interval: "weekly"
    # Fleet policy (constitution XV.3): nothing under 7 days old.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # A new Python minor is a runtime migration, not a base refresh: the uv
    # lock is solved for one interpreter and onnxruntime ships per-minor
    # wheels, so 3.14 -> 3.15 failed every build (#874). Digest bumps within
    # the pinned tag still flow; the next minor is moved by hand.
    ignore:
      - dependency-name: "hummingbird/python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
