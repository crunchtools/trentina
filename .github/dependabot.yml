# Canonical Dependabot config for crunchtools Python projects using uv.
# Drop in as .github/dependabot.yml. See constitution.md Section XV.
#
# Covers both ecosystems that go stale silently if left unpinned:
#   - uv:            uv.lock (must be committed, never gitignored)
#   - github-actions: `uses: some-action@vX.Y.Z` pins in .github/workflows/

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"

  # scripts/l2-pod-requirements.txt pins what the RunPod GPU image installs to
  # train the L2 model. It was covered by security updates only (that is how
  # transformers' five open advisories reached us as #547 while routine
  # versions never did), so it is declared here like any other ecosystem
  # present in the repo (XV.2). Majors wait for a human: a bump here is proved
  # by the next training round, whose recorded gates a new model must pass.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
