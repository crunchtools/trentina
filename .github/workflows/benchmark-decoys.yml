name: Benchmark - decoy tools

# The decoy-tool spikes (#357). `decoys` is benchmarks/decoy_tools.py on every
# judge that ships a prompt pack; `detonation` is benchmarks/detonation.py on
# models picked for being easy to steer, with the judges' verdicts on the
# same documents beside it; `venn` is the same harness with every insert in
# every carrier and several draws per document, joined document by document
# with the judges' majority verdicts. `briefing` is the judges on the clean and
# benign-insert documents under each Layer 2 label the briefing can carry, and
# `packs` is benchmarks/prompt_pack.py for every shipped pack against the
# generic prompts, held-out, embedded documents included (#397). `corpora` is
# benchmarks/provider_benchmark.py on the garak and disclosed corpora for every
# shipped judge (#10, #29), and on the invented meeting notes (#450). `paging`
# is benchmarks/paging_l3.py for every shipped judge: an attack split across
# the parts of a response delivered in parts (#448). `gatekeeper` is
# benchmarks/gatekeeper.py for every shipped judge: guarded execution on the
# calls in corpora/gatekeeper.py (#456), run inside the image this checkout
# builds so the arguments step includes L2 (#462). `egress-bench` is
# benchmarks/egress_bench.py (#507): the terminating egress route scored on the
# calls in corpora/egress_bench.py — credential DLP and SSRF rails
# (deterministic), and response injection through the layers (judge-dependent),
# run inside the image so the response axis is L1/L2/L3 as production runs it.
# `agent-egress-bench` is the third-party agent-egress-bench (#507), pinned by
# commit, driving the shipped image configured by benchmarks/agent_egress/ and
# nothing else: its fetch adapter through a `forward` instance, in flag and in
# block. The bench's runner gets no secret and no Docker socket.
# `tune` is benchmarks/prompt_pack.py for one judge
# with a candidate pack handed in as an input (#397): the pack is data the
# merged harness reads, so a pack can be tuned without unreviewed code ever
# running beside the key. Started by hand, never by a push or a pull request: it
# spends money, and it runs the checked-out code with OPENROUTER_API_KEY in
# its environment, so it runs merged code only, as live-l3 in ci.yml does.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which spike to run"
        type: choice
        options: [detonation, venn, decoys, briefing, packs, corpora, paging, gatekeeper, egress-bench, agent-egress-bench, tune]
        default: detonation
      external:
        description: "External corpus split (test is the held-out one)"
        type: choice
        options: [test, all, none]
        default: test
      design:
        description: "two-call: a tools-only tripwire call. one-call: tools and schema together"
        type: choice
        options: [two-call, one-call]
        default: two-call
      model:
        description: "tune: the judge the candidate pack is for"
        type: choice
        options:
          - google/gemini-2.5-flash-lite
          - google/gemini-3.5-flash-lite
          - anthropic/claude-haiku-4.5
          - google/gemini-3.8-flash
        default: google/gemini-2.5-flash-lite
      split:
        description: "tune: train names what the pack got wrong, one vote. held-out gates it against the generic prompts, three votes"
        type: choice
        options: [train, held-out]
        default: train
      briefing:
        description: "tune: what the judge is told Layer 2 made of each case, as production briefs it; none sends the case alone"
        type: choice
        options: [benign, malicious, none]
        default: benign
      bench_ref:
        description: "agent-egress-bench: the bench commit to run (a full SHA)"
        type: string
        default: "7339fef95630ce811f66aa39c7bab879d9f9e6e7"
      pack:
        description: "tune: the candidate pack, base64 of its JSON"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  decoys:
    name: ${{ matrix.model }}
    # A dispatch can name any branch. Only main is reviewed code.
    if: github.ref == 'refs/heads/main' && inputs.job == 'decoys'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # One per file in src/trentina/quarantine/prompt_packs/.
        include:
          - model: google/gemini-2.5-flash-lite
          - model: google/gemini-3.5-flash-lite
          - model: google/gemini-3.8-flash
            reasoning: minimal
          - model: anthropic/claude-haiku-4.5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      - name: Run the spike
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ matrix.model }}
          QUARANTINE_REASONING_EFFORT: ${{ matrix.reasoning }}
          EXTERNAL: ${{ inputs.external }}
          DESIGN: ${{ inputs.design }}
        run: |
          set -o pipefail
          uv run --no-sync python benchmarks/decoy_tools.py \
            --external "$EXTERNAL" --design "$DESIGN" --json decoy-tools.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artifact name
        id: slug
        env:
          MODEL: ${{ matrix.model }}
        run: echo "name=decoy-tools-${MODEL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always() && hashFiles('decoy-tools.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slug.outputs.name }}
          path: decoy-tools.json
          retention-days: 30

  detonation:
    name: ${{ matrix.mode }} ${{ matrix.model }}
    if: github.ref == 'refs/heads/main' && inputs.job == 'detonation'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cheap, tool-capable, and by reputation easy to steer.
          - { mode: detonate, model: mistralai/mistral-nemo }
          - { mode: detonate, model: meta-llama/llama-3.1-8b-instruct }
          - { mode: detonate, model: qwen/qwen-2.5-7b-instruct }
          - { mode: detonate, model: amazon/nova-micro-v1 }
          - { mode: detonate, model: google/gemma-3-12b-it }
          - { mode: detonate, model: mistralai/ministral-8b-2512 }
          - { mode: detonate, model: openai/gpt-oss-20b }
          # The L3 default, and two of what agents behind the gateway run on.
          - { mode: detonate, model: google/gemini-2.5-flash-lite }
          - { mode: detonate, model: anthropic/claude-haiku-4.5 }
          - { mode: detonate, model: google/gemini-3.8-flash, reasoning: minimal }
          # The shipped judges, on the same documents, with no tools.
          - { mode: judge, model: google/gemini-2.5-flash-lite }
          - { mode: judge, model: google/gemini-3.5-flash-lite }
          - { mode: judge, model: anthropic/claude-haiku-4.5 }
          - { mode: judge, model: google/gemini-3.8-flash, reasoning: minimal }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      - name: Run the spike
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ matrix.model }}
          QUARANTINE_REASONING_EFFORT: ${{ matrix.reasoning }}
          MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          uv run --no-sync python benchmarks/detonation.py \
            --mode "$MODE" --json detonation.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artifact name
        id: slug
        env:
          MODEL: ${{ matrix.model }}
          MODE: ${{ matrix.mode }}
        run: echo "name=detonation-${MODE}-${MODEL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always() && hashFiles('detonation.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slug.outputs.name }}
          path: detonation.json
          retention-days: 30

  briefing:
    name: briefing ${{ matrix.arm }} ${{ matrix.model }}
    if: github.ref == 'refs/heads/main' && inputs.job == 'briefing'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The shipped judges, under each Layer 2 label the briefing can carry.
        model:
          - google/gemini-2.5-flash-lite
          - google/gemini-3.5-flash-lite
          - anthropic/claude-haiku-4.5
          - google/gemini-3.8-flash
        arm: [none, benign, malicious]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      - name: Run the spike
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ matrix.model }}
          QUARANTINE_REASONING_EFFORT: ${{ matrix.model == 'google/gemini-3.8-flash' && 'minimal' || '' }}
          ARM: ${{ matrix.arm }}
        run: |
          set -o pipefail
          uv run --no-sync python benchmarks/detonation.py \
            --mode judge --briefing "$ARM" --carriers all --tasks 0 \
            --only clean,benign,attack --no-injecagent --votes 3 --concurrency 16 \
            --json detonation.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artifact name
        id: slug
        env:
          MODEL: ${{ matrix.model }}
          ARM: ${{ matrix.arm }}
        run: echo "name=briefing-${ARM}-${MODEL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always() && hashFiles('detonation.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slug.outputs.name }}
          path: detonation.json
          retention-days: 30

  packs:
    name: pack ${{ matrix.model }}
    if: github.ref == 'refs/heads/main' && inputs.job == 'packs'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # One per file in src/trentina/quarantine/prompt_packs/.
        include:
          - { model: google/gemini-2.5-flash-lite, pack: gemini-2.5-flash-lite }
          - { model: google/gemini-3.5-flash-lite, pack: gemini-3.5-flash-lite }
          - { model: anthropic/claude-haiku-4.5, pack: claude-haiku-4.5 }
          - { model: google/gemini-3.8-flash, pack: gemini-3.8-flash, reasoning: minimal }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      # The generic prompts first: the baseline the shipped pack is gated on.
      # The gate's exit status is the job's, so a pack the embedded documents
      # now fail shows red, with both reports uploaded either way.
      - name: Measure the shipped pack against the generic prompts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ matrix.model }}
          QUARANTINE_REASONING_EFFORT: ${{ matrix.reasoning }}
          PACK: src/trentina/quarantine/prompt_packs/${{ matrix.pack }}.json
        run: |
          set -o pipefail
          uv run --no-sync python benchmarks/prompt_pack.py --provider openrouter \
            --prompt-pack generic --votes 3 --concurrency 8 --out generic.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          uv run --no-sync python benchmarks/prompt_pack.py --provider openrouter \
            --prompt-pack "$PACK" --votes 3 --concurrency 8 --baseline generic.json \
            --out pack.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always() && hashFiles('generic.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.pack }}
          path: |
            generic.json
            pack.json
          retention-days: 30

  tune:
    name: tune ${{ inputs.model }} (${{ inputs.split }})
    if: github.ref == 'refs/heads/main' && inputs.job == 'tune'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      # The input reaches the shell as an environment variable, never as
      # workflow text, and is parsed as JSON before anything reads it.
      - name: Write the candidate pack
        env:
          PACK_B64: ${{ inputs.pack }}
        run: |
          printf '%s' "$PACK_B64" | base64 --decode > candidate.json
          python3 -c "import json; json.load(open('candidate.json'))"

      # A train run names the cases the pack got wrong and cannot emit one.
      - name: Tune on the train split
        if: inputs.split == 'train'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ inputs.model }}
          QUARANTINE_REASONING_EFFORT: ${{ inputs.model == 'google/gemini-3.8-flash' && 'minimal' || '' }}
          BRIEFING: ${{ inputs.briefing }}
        run: |
          set -o pipefail
          uv run --no-sync python benchmarks/prompt_pack.py --provider openrouter \
            --prompt-pack candidate.json --split train --concurrency 8 \
            --briefing "$BRIEFING" \
            --out pack.json | tee -a "$GITHUB_STEP_SUMMARY"

      # The gate's exit status is the job's; emitted.json exists only when
      # the candidate passed.
      - name: Gate on the held-out split
        if: inputs.split == 'held-out'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ inputs.model }}
          QUARANTINE_REASONING_EFFORT: ${{ inputs.model == 'google/gemini-3.8-flash' && 'minimal' || '' }}
          BRIEFING: ${{ inputs.briefing }}
        run: |
          set -o pipefail
          uv run --no-sync python benchmarks/prompt_pack.py --provider openrouter \
            --prompt-pack generic --votes 3 --concurrency 8 --briefing "$BRIEFING" \
            --out generic.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          uv run --no-sync python benchmarks/prompt_pack.py --provider openrouter \
            --prompt-pack candidate.json --votes 3 --concurrency 8 --briefing "$BRIEFING" \
            --baseline generic.json \
            --emit emitted.json --out pack.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always() && hashFiles('candidate.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: tune-${{ inputs.split }}-${{ github.run_id }}
          path: |
            candidate.json
            generic.json
            pack.json
            emitted.json
          retention-days: 30

  paging:
    name: paging ${{ matrix.model }}
    if: github.ref == 'refs/heads/main' && inputs.job == 'paging'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One per file in src/trentina/quarantine/prompt_packs/.
        include:
          - { model: google/gemini-2.5-flash-lite }
          - { model: google/gemini-3.5-flash-lite }
          - { model: anthropic/claude-haiku-4.5 }
          - { model: google/gemini-3.8-flash, reasoning: minimal }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      # Every corpus attack whole, cut across two adjacent parts, and with
      # its halves in parts that do not touch, each part through defend()
      # with the part briefing. No L2 model here: L3 is what is measured.
      - name: Judge the split attacks
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRENTINA_MODEL_PROVIDER: openrouter
          QUARANTINE_MODEL: ${{ matrix.model }}
          QUARANTINE_REASONING_EFFORT: ${{ matrix.reasoning }}
        run: |
          set -o pipefail
          mkdir -p results
          uv run --no-sync python benchmarks/paging_l3.py --votes 3 --concurrency 8 \
            --json results/paging_l3.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artifact name
        id: slug
        env:
          MODEL: ${{ matrix.model }}
        run: echo "name=paging-${MODEL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always() && hashFiles('results/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slug.outputs.name }}
          path: results/
          retention-days: 30

  gatekeeper:
    name: gatekeeper ${{ matrix.model }}
    if: github.ref == 'refs/heads/main' && inputs.job == 'gatekeeper'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One per file in src/trentina/quarantine/prompt_packs/.
        include:
          - { model: google/gemini-2.5-flash-lite }
          - { model: google/gemini-3.5-flash-lite }
          - { model: anthropic/claude-haiku-4.5 }
          - { model: google/gemini-3.8-flash, reasoning: minimal }
    steps:
      - uses: actions/checkout@v7

      # The image this checkout builds, so the arguments step is L1, L2 and
      # L3 with the pinned model that passed its gates, as production runs it
      # (#462). Built without the key: no build step ever sees it.
      - name: Build the image
        run: docker build -f Containerfile -t trentina:bench .

      # Every call through gatekeeper.evaluate, three votes each, inside the
      # image. --require-l2 fails the job if the model did not load, rather
      # than publish figures taken without it. The benchmark and corpus are
      # mounted read-only; the image's own package is the code measured.
      - name: Judge the guarded calls
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ matrix.model }}
          QUARANTINE_REASONING_EFFORT: ${{ matrix.reasoning }}
        run: |
          set -o pipefail
          mkdir -p results && chmod 777 results
          docker run --rm \
            --read-only --tmpfs /tmp --cap-drop=all \
            --security-opt no-new-privileges \
            --entrypoint python \
            -v "$GITHUB_WORKSPACE/benchmarks:/bench/benchmarks:ro" \
            -v "$GITHUB_WORKSPACE/corpora:/bench/corpora:ro" \
            -v "$GITHUB_WORKSPACE/results:/results" \
            -e OPENROUTER_API_KEY -e QUARANTINE_MODEL -e QUARANTINE_REASONING_EFFORT \
            -e TRENTINA_MODEL_PROVIDER=openrouter \
            -e QUARANTINE_DB=/tmp/bench.db \
            trentina:bench \
            /bench/benchmarks/gatekeeper.py --require-l2 --votes 3 --concurrency 8 \
              --json /results/gatekeeper.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artifact name
        id: slug
        env:
          MODEL: ${{ matrix.model }}
        run: echo "name=gatekeeper-${MODEL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always() && hashFiles('results/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slug.outputs.name }}
          path: results/
          retention-days: 30

  egress-bench:
    name: egress-bench ${{ matrix.model }}
    if: github.ref == 'refs/heads/main' && inputs.job == 'egress-bench'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { model: google/gemini-3.5-flash-lite }
    steps:
      - uses: actions/checkout@v7

      # The image this checkout builds, so the response axis is L1, L2 and L3
      # with the pinned model, as production judges a fetched response (#462).
      # Built without the key: no build step ever sees it. The DLP and SSRF
      # axes are deterministic and run regardless of the judge.
      - name: Build the image
        run: docker build -f Containerfile -t trentina:bench .

      # The benchmark and corpus mounted read-only; the image's own package is
      # the code measured. Three votes on the response axis.
      - name: Score the egress route
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ matrix.model }}
        run: |
          set -o pipefail
          mkdir -p results && chmod 777 results
          docker run --rm \
            --read-only --tmpfs /tmp --cap-drop=all \
            --security-opt no-new-privileges \
            --entrypoint python \
            -v "$GITHUB_WORKSPACE/benchmarks:/bench/benchmarks:ro" \
            -v "$GITHUB_WORKSPACE/corpora:/bench/corpora:ro" \
            -v "$GITHUB_WORKSPACE/results:/results" \
            -e OPENROUTER_API_KEY -e QUARANTINE_MODEL \
            -e TRENTINA_MODEL_PROVIDER=openrouter \
            -e QUARANTINE_DB=/tmp/bench.db \
            trentina:bench \
            /bench/benchmarks/egress_bench.py --votes 3 \
              --json /results/egress-bench.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artifact name
        id: slug
        env:
          MODEL: ${{ matrix.model }}
        run: echo "name=egress-bench-${MODEL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always() && hashFiles('results/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slug.outputs.name }}
          path: results/
          retention-days: 30

  agent-egress-bench:
    name: agent-egress-bench ${{ matrix.mode }}
    if: github.ref == 'refs/heads/main' && inputs.job == 'agent-egress-bench'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [flag, block]
    env:
      MODEL: google/gemini-3.5-flash-lite
      BENCH_REF: ${{ inputs.bench_ref }}
      AEB_TRENTINA_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7

      # Built without the key: no build step ever sees it.
      - name: Build the image
        run: docker build -f Containerfile -t trentina:bench .

      # The bench at the pinned commit, its runner built in a Go container. The
      # bench is third-party code: neither its build nor its run sees a secret.
      - name: Build the bench runner
        run: |
          set -eu
          case "$BENCH_REF" in *[!0-9a-f]*|"") echo "bench_ref must be a SHA" >&2; exit 64 ;; esac
          git init -q bench && cd bench
          git fetch -q --depth 1 https://github.com/luckyPipewrench/agent-egress-bench "$BENCH_REF"
          git checkout -q FETCH_HEAD
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src/runner \
            -e HOME=/tmp -e GOCACHE=/tmp/go-cache -e GOPATH=/tmp/go -e CGO_ENABLED=0 \
            -e GOFLAGS=-buildvcs=false docker.io/library/golang:1.26 go build -o /src/aeb-runner .

      # The gateway runs as production runs it, from this image, judging on the
      # pinned model; the bench's fixture names resolve to its loopback fixtures.
      # Only this step holds the provider key. The shim gives the bench's fetch
      # adapter the per-run bearer.
      - name: Start the gateway and the shim
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -eu
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          mkdir -p results kit-run && chmod 777 results kit-run
          cat > run-gateway.sh <<'EOF'
          #!/bin/sh
          exec docker run -d --name aeb-gateway --network host \
            --add-host aeb-fixture.test:127.0.0.1 --add-host cdn.fixture.example.com:127.0.0.2 \
            --read-only --tmpfs /tmp --cap-drop=all --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE/kit-run:/cfg:ro" \
            -e TRENTINA_GATEWAY_ENABLED=1 -e TRENTINA_PROFILES_PATH=/cfg/profiles.yaml \
            -e BENCH_TOKEN -e OPENROUTER_API_KEY -e QUARANTINE_MODEL="$MODEL" \
            -e TRENTINA_MODEL_PROVIDER=openrouter -e QUARANTINE_DB=/tmp/trentina.db \
            -e TRENTINA_FETCH_PRIVATE_NAMES=aeb-fixture.test,cdn.fixture.example.com \
            trentina:bench "$@"
          EOF
          chmod +x run-gateway.sh
          BENCH_TOKEN="$token" AEB_TRENTINA_WORK="$GITHUB_WORKSPACE/kit-run" \
            AEB_TRENTINA_RUN="$GITHUB_WORKSPACE/run-gateway.sh" \
            benchmarks/agent_egress/start-gateway.sh
          sed "s|@BENCH_TOKEN@|$token|" benchmarks/agent_egress/shim.conf > shim.conf
          docker run -d --name aeb-shim --network host \
            -v "$PWD/shim.conf:/etc/nginx/nginx.conf:ro" docker.io/library/nginx:1.27-alpine
          rm shim.conf run-gateway.sh
          for _ in $(seq 120); do curl -sf http://127.0.0.1:8000/health >/dev/null && break; sleep 5; done
          curl -sf http://127.0.0.1:8000/health

      # The bench's runner in a container of its own: the host network to reach
      # the shim and its own fixtures, no key, no Docker socket, read-only.
      - name: Run the fetch adapter through forward
        run: |
          set -eu
          docker run --rm --network host --read-only --tmpfs /tmp --cap-drop=all \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE/bench:/bench:ro" \
            -v "$GITHUB_WORKSPACE/benchmarks/agent_egress:/kit:ro" \
            -v "$GITHUB_WORKSPACE/kit-run:/kit-run:ro" \
            -v "$GITHUB_WORKSPACE/results:/results" -w /bench \
            docker.io/library/golang:1.26 /bench/aeb-runner \
              --cases /bench/cases --profile /kit/tool-profile.json --adapter proxy \
              --proxy-addr 127.0.0.1:18899 --fixtures --timeout 120s \
              --adapter-owner crunchtools --target-config /kit-run/profiles.yaml \
              --method-repository https://github.com/luckyPipewrench/agent-egress-bench \
              --method-commit "$BENCH_REF" --tool-version "$GITHUB_SHA" \
              --output "/results/fetch-$AEB_TRENTINA_MODE.json" \
              > "results/fetch-$AEB_TRENTINA_MODE.log" 2>&1 || rc=$?
          grep -v '^{' "results/fetch-$AEB_TRENTINA_MODE.log" | tee -a "$GITHUB_STEP_SUMMARY"
          # The runner exits nonzero on an incomplete measurement, which a run
          # with unserved transports always is; that still publishes. No summary
          # at all is an infrastructure failure, and fails the job.
          echo "runner exit: ${rc:-0}" | tee -a "$GITHUB_STEP_SUMMARY"
          test -s "results/fetch-$AEB_TRENTINA_MODE.json"

      - name: Stop the gateway
        if: always()
        run: docker rm -f aeb-gateway aeb-shim >/dev/null 2>&1 || true

      # Not hashFiles(): an outcome-only condition keeps a missing summary loud.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-egress-bench-${{ matrix.mode }}
          path: results/
          if-no-files-found: error
          retention-days: 90

  corpora:
    name: corpora ${{ matrix.model }}
    if: github.ref == 'refs/heads/main' && inputs.job == 'corpora'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One per file in src/trentina/quarantine/prompt_packs/.
        include:
          - { model: google/gemini-2.5-flash-lite }
          - { model: google/gemini-3.5-flash-lite }
          - { model: anthropic/claude-haiku-4.5 }
          - { model: google/gemini-3.8-flash, reasoning: minimal }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      # The garak sample (one attack in five, every benign control) and the
      # disclosed payloads, each reported apart. The internal corpus rides
      # along as the number the others are read against. The notes are the
      # invented meeting notes of known gap 28 (#450), all benign: the judge
      # half of what benchmarks/l2_lone_flag.py joins with L2.
      - name: Judge the corpora
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRENTINA_MODEL_PROVIDER: openrouter
          QUARANTINE_MODEL: ${{ matrix.model }}
          QUARANTINE_REASONING_EFFORT: ${{ matrix.reasoning }}
        run: |
          set -o pipefail
          for corpus in internal garak disclosed notes; do
            uv run --no-sync python benchmarks/provider_benchmark.py \
              --providers openrouter --corpus "$corpus" --concurrency 8 --retries 3 \
              --out "results/$corpus"
            cat "results/$corpus"/*.md >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Artifact name
        id: slug
        env:
          MODEL: ${{ matrix.model }}
        run: echo "name=corpora-${MODEL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always() && hashFiles('results/**/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slug.outputs.name }}
          path: results/
          retention-days: 30

  venn:
    name: venn ${{ matrix.mode }} ${{ matrix.model }}
    if: github.ref == 'refs/heads/main' && inputs.job == 'venn'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # The four that tripped in the detonation run: five draws a document.
          - { mode: detonate, model: meta-llama/llama-3.1-8b-instruct, flags: "--votes 5 --temperature 0.7" }
          - { mode: detonate, model: openai/gpt-oss-20b, flags: "--votes 5 --temperature 0.7" }
          - { mode: detonate, model: qwen/qwen-2.5-7b-instruct, flags: "--votes 5 --temperature 0.7" }
          - { mode: detonate, model: google/gemma-3-12b-it, flags: "--votes 5 --temperature 0.7" }
          # The shipped judges, three votes as their packs were measured.
          - { mode: judge, model: google/gemini-2.5-flash-lite, flags: "--votes 3" }
          - { mode: judge, model: google/gemini-3.5-flash-lite, flags: "--votes 3" }
          - { mode: judge, model: anthropic/claude-haiku-4.5, flags: "--votes 3" }
          - { mode: judge, model: google/gemini-3.8-flash, flags: "--votes 3", reasoning: minimal }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      - name: Run the spike
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUARANTINE_MODEL: ${{ matrix.model }}
          QUARANTINE_REASONING_EFFORT: ${{ matrix.reasoning }}
          MODE: ${{ matrix.mode }}
          FLAGS: ${{ matrix.flags }}
        run: |
          set -o pipefail
          # FLAGS is a fixed list of options from the matrix above, split on purpose.
          # shellcheck disable=SC2086
          uv run --no-sync python benchmarks/detonation.py \
            --mode "$MODE" --carriers all --tasks 0 --only clean,benign,attack \
            --concurrency 16 $FLAGS --json detonation.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artifact name
        id: slug
        env:
          MODEL: ${{ matrix.model }}
          MODE: ${{ matrix.mode }}
        run: echo "name=venn-${MODE}-${MODEL//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always() && hashFiles('detonation.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.slug.outputs.name }}
          path: detonation.json
          retention-days: 30

  venn-report:
    name: venn report
    needs: venn
    # Reads artifacts only: no key, and it runs even if one model's job failed.
    if: always() && github.ref == 'refs/heads/main' && inputs.job == 'venn'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      - name: Download the run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'venn-*' --dir results

      - name: Join judges and decoys, document by document
        run: |
          set -o pipefail
          uv run --no-sync python benchmarks/detonation.py --mode venn \
            --judge-json results/venn-judge-*/detonation.json \
            --detonate-json results/venn-detonate-*/detonation.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
