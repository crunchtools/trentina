name: Container Promote

# This file no longer builds anything (#689). `security.yml`'s `sdlc ci` job
# builds the image ONCE per push to main through python-sdlc, tests it from
# inside as production runs it, and `publish` pushes exactly those bytes to both
# registries. Before, this workflow rebuilt the image twice on every
# merge -- once per registry -- so main built three copies, the verified one was
# discarded and the two published ones had been scanned by nothing.
#
# What is left here is the release: a tag promotes the digest main already built
# and verified, by retag. That sentence used to be true only by sequencing. It
# is now true by construction, because the job `promote` asserts ran is the job
# that pushed the bytes it promotes.
#
# No `workflow_dispatch`: a hand-started publish is not a property worth having
# for an image-only security product, and nothing here builds for it to start.
on:
  push:
    tags: ["v*"]

# Every run here is a tag, so every run keys on `run_id`, which is unique: no
# run contends and none can be dropped. The expression is kept as the fleet's
# one spelling rather than simplified, so this file reads the same as the
# others.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QUAY_IMAGE: quay.io/crunchtools/trentina
  GHCR_IMAGE: ghcr.io/crunchtools/trentina

jobs:
  # A release is a retag, not a build. The digest main pushed is the one the
  # required checks passed against; building the tag again would publish bytes
  # nothing had verified, and discover a broken image at ship time.
  promote:
    name: Promote the verified digest
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      checks: read
      statuses: read
      actions: read    # resolve security.yml's own run for this commit
      packages: write

    steps:
      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # Fail closed, and not as "no check reported a failure": a check still
      # running, cancelled or never started has no failure conclusion either,
      # and a tag pushed minutes after the merge would promote past all of them.
      #
      # Still running is also not the same as failed, so this WAITS instead of
      # refusing. `release.yml` tags the merge commit within seconds of the
      # merge, so this run routinely starts while main's own `sdlc ci` is still
      # building the image it is here to promote. Refusing there is how v6.13.0
      # came to be tagged, released, and absent from both registries until a
      # person re-ran this job -- Nagios reported it as "Registry drift:
      # trentina:6.13.0[quay+ghcr] missing". A release nobody can pull is the
      # state failing closed is meant to prevent, not to produce.
      #
      # The wait is bounded and every other answer stays immediate: a terminal
      # conclusion that is not `success` has nothing to wait for and refuses on
      # the spot, and so does running out of WAIT_SECONDS.
      #
      # The contexts the branch ruleset requires are READ from the ruleset: a
      # copy here goes stale the first time a required check is added, silently
      # and in the direction of promoting more. Each must have concluded
      # `success` on this commit, through either API -- a check run (Actions) or
      # a commit status (anything posting a classic context).
      #
      # Absence is a refusal EXCEPT for the checks in PR_ONLY, which run only on
      # a pull request and so never attach to the squash-merge commit. That list
      # is written out, not inferred from "nothing reported": "no run found"
      # otherwise means both "enforced on the PR" and "never ran", which are
      # opposite answers. Any other absence is waited on and then refused, since
      # a check GitHub has not created yet also reports nothing.
      #
      # The job that BUILT and verified the image is then checked separately,
      # and by WORKFLOW FILE rather than by context name: a name is a string,
      # and a check run carrying it could come from any workflow in the repo.
      # `security.yml`'s own run for this commit is resolved, and the job inside
      # it must have concluded `success`. It may not be absent at all.
      - name: The required checks passed on this commit
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          RUN_ID: ${{ github.run_id }}
          VERIFIER_WORKFLOW: security.yml
          VERIFIER_JOB: sdlc ci
          # security.yml finishes in six to eight minutes. The budget is sized
          # for a queued runner rather than for a long build, and it ends in a
          # refusal, so being generous costs a slow failure and nothing else.
          WAIT_SECONDS: "1800"
          POLL_SECONDS: "20"
          PR_ONLY: |
            Protect workflows
            Gatehouse triage / Gatehouse triage
        run: |
          set -eu
          # `rules/branches/<branch>` needs no more than the `contents: read`
          # this job holds -- on a public repository it answers unauthenticated.
          # It is NOT `repos/{owner}/{repo}/rulesets`, which does want
          # Administration read, and which GITHUB_TOKEN cannot be granted.
          required=$(gh api "repos/$REPO/rules/branches/$BRANCH" \
            -q '.[] | select(.type == "required_status_checks")
                  | .parameters.required_status_checks[].context' | sort -u)
          [ -n "$required" ] || {
            echo "cannot read the checks $BRANCH requires; nothing is promoted" >&2
            exit 1
          }
          runs="$RUNNER_TEMP/outcomes.tsv"
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          add_wait() { waiting="${waiting:+$waiting, }$1"; }
          while :; do
            bad=0
            waiting=
            # This run's own jobs are attached to the same commit and are of
            # course not finished, so they are left out by run id.
            gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
              -q '.check_runs[] | select(.details_url | contains("/runs/'"$RUN_ID"'/") | not)
                    | [.name, (.conclusion // "pending"), .started_at] | @tsv' \
              > "$runs"
            # A required context may be a commit status rather than a check run.
            gh api "repos/$REPO/commits/$SHA/status" --paginate \
              -q '.statuses[] | [.context, .state, .updated_at] | @tsv' \
              >> "$runs"
            while IFS= read -r context; do
              [ -n "$context" ] || continue
              # The newest report of that name, so a rerun that fixed a flake
              # counts and the failure it replaced does not.
              got=$(awk -F'\t' -v n="$context" '$1 == n' "$runs" \
                | sort -t"$(printf '\t')" -k3 | tail -1 | cut -f2)
              case "${got:-absent}" in
                success)
                  printf '  %s: success\n' "$context"
                  ;;
                pending)
                  add_wait "$context"
                  ;;
                absent)
                  if printf '%s\n' "$PR_ONLY" | grep -qxF "$context"; then
                    printf '  %s: pull-request only, enforced where it ran\n' "$context"
                  else
                    add_wait "$context (no run yet)"
                  fi
                  ;;
                *)
                  printf '  %s: %s\n' "$context" "$got" >&2
                  bad=1
                  ;;
              esac
            done < <(printf '%s\n' "$required")
            # Resolved through the workflow file, so the answer comes from
            # security.yml's run and not from anything that merely posted a
            # check with that name. The newest run for this commit, so a re-run
            # counts -- and only a PUSH to the default branch: that run executes
            # main's own workflow file, where a pull request's run executes the
            # PR's.
            found=$(gh api \
              "repos/$REPO/actions/workflows/$VERIFIER_WORKFLOW/runs?head_sha=$SHA&per_page=100" \
              -q '[.workflow_runs[] | select(.id != ('"$RUN_ID"'|tonumber))
                    | select(.event == "push" and .head_branch == env.BRANCH)]
                    | sort_by(.run_started_at) | last | [.id, .status] | @tsv')
            if [ -z "$found" ]; then
              # The tag and the merge arrive together, so the run may not have
              # been created yet. Still absent at the deadline is the refusal.
              add_wait "$VERIFIER_WORKFLOW (no run yet)"
            else
              verifier_run=$(printf '%s' "$found" | cut -f1)
              verifier_status=$(printf '%s' "$found" | cut -f2)
              verdict=$(gh api "repos/$REPO/actions/runs/$verifier_run/jobs" --paginate \
                -q '.jobs[] | select(.name == env.VERIFIER_JOB) | .conclusion // "pending"' \
                | tail -1)
              if [ "$verdict" = success ] && [ "$verifier_status" = completed ]; then
                printf '  %s in %s (run %s): success\n' \
                  "$VERIFIER_JOB" "$VERIFIER_WORKFLOW" "$verifier_run"
              elif [ "$verdict" = success ] || [ "$verdict" = pending ] || [ -z "$verdict" ]; then
                # The WHOLE run has to finish, not just `sdlc ci`. The digests
                # the next step reads are an artifact uploaded by that run's
                # `publish` job, which starts only once `sdlc ci` has passed, so
                # treating `sdlc ci` alone as the signal moves this race one job
                # along instead of closing it.
                add_wait "$VERIFIER_JOB in $VERIFIER_WORKFLOW (${verdict:-no job yet}, run $verifier_status)"
              else
                printf '%s in %s (run %s) is %s; nothing verified the image\n' \
                  "$VERIFIER_JOB" "$VERIFIER_WORKFLOW" "$verifier_run" "$verdict" >&2
                bad=1
              fi
            fi
            if [ "$bad" -ne 0 ]; then
              echo "refusing to promote $SHA" >&2
              exit 1
            fi
            [ -n "$waiting" ] || break
            left=$(( deadline - $(date +%s) ))
            if [ "$left" -le 0 ]; then
              echo "waited ${WAIT_SECONDS}s for: $waiting" >&2
              echo "refusing to promote $SHA" >&2
              exit 1
            fi
            echo "waiting for: $waiting (${left}s of the budget left)"
            sleep "$POLL_SECONDS"
          done
          echo "verifier_run=$verifier_run" >> "$GITHUB_OUTPUT"

      # What that run's `publish` job pushed, by digest. Nothing else writes this
      # artifact: it is uploaded by `publish`, in the push-to-main run resolved
      # above, after the push succeeded.
      - name: The digests that run published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ steps.checks.outputs.verifier_run }}
        run: |
          set -eu
          gh run download "$RUN" -R "$REPO" -n published-digests -D "$RUNNER_TEMP/published" || {
            echo "run $RUN recorded no published digests; nothing is promoted" >&2
            exit 1
          }
          cat "$RUNNER_TEMP/published/published.json"

      # The identity check, and the reason a retag is safe: the digest that
      # this commit's publish recorded must have been built from THIS commit and
      # must carry the version the tag names. A force-push, a reverted main or a
      # tag on an unbuilt commit each fail here rather than publishing the wrong
      # bytes.
      #
      # Each registry is checked SEPARATELY. The same image pushed to Quay and
      # GHCR can be stored under different manifest digests, so promoting
      # Quay's digest into GHCR would name a manifest that registry never saw.
      #
      # Pulled rather than read through `imagetools inspect --format`: the
      # labels live in the image config, which the template reaches differently
      # across buildx versions and not at all for a multi-platform index. A
      # release can afford two pulls; publishing the wrong bytes it cannot.
      - name: The digests main built are this commit, at this version
        id: verified
        env:
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version=${REF_NAME#v}
          # EXACTLY three numeric components. A glob like [0-9]*.[0-9]*.[0-9]*
          # also accepts v1.2.3.4, and `minor=${version%.*}` would then derive
          # `1.2.3` and move THAT release's tag to this image. A prerelease
          # (v6.3.0-rc1) is refused here on purpose rather than promoted: the
          # alias it would derive is not a thing anyone asked for.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag '$REF_NAME' is not vX.Y.Z with exactly three numbers" >&2
            exit 1
          }
          for registry in quay ghcr; do
            case "$registry" in
              quay) image="$QUAY_IMAGE" ;;
              ghcr) image="$GHCR_IMAGE" ;;
            esac
            # The digest publish recorded for this commit -- not whatever :main
            # names now, which a later merge or anything else holding
            # packages:write can move.
            recorded="$RUNNER_TEMP/published/published.json"
            [ "$(jq -r .sha "$recorded")" = "$SHA" ] || {
              echo "the recorded digests are for $(jq -r .sha "$recorded"), this tag is $SHA" >&2
              exit 1
            }
            digest=$(jq -r ".$registry // empty" "$recorded")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "no valid $registry digest recorded for $SHA" >&2
              exit 1
            }
            now=$(docker buildx imagetools inspect "$image:main" --format '{{ .Manifest.Digest }}' || true)
            [ "$now" = "$digest" ] || echo "::notice::$image:main has moved on to ${now:-unresolved}; promoting the recorded $digest"
            docker pull --quiet "$image@$digest" >/dev/null
            revision=$(docker inspect --format \
              '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image@$digest")
            label=$(docker inspect --format \
              '{{ index .Config.Labels "version" }}' "$image@$digest")
            [ "$revision" = "$SHA" ] || {
              echo "$image:main was built from $revision, this tag is $SHA" >&2
              echo "main has moved or this commit never built; nothing is promoted" >&2
              exit 1
            }
            [ "$label" = "$version" ] || {
              echo "$image@$digest states version '$label', the tag says '$version'" >&2
              exit 1
            }
            echo "${registry}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "::notice::$image@$digest verified for $version"
          done
          {
            echo "version=$version"
            echo "minor=${version%.*}"
          } >> "$GITHUB_OUTPUT"

      # The released tags name the SAME digest publish recorded. Copied within
      # one repository, so every blob is already there and nothing is
      # re-uploaded. Not `imagetools create`: given a single image manifest
      # (what podman pushes since #692) it writes a new one-entry manifest
      # list, so 6.4.1 got a digest main never had. `--preserve-digests`
      # refuses any copy that would change the manifest, and the check after
      # it fails the release if a tag still resolves to anything else.
      - name: Retag the digests in both registries
        env:
          QUAY_DIGEST: ${{ steps.verified.outputs.quay_digest }}
          GHCR_DIGEST: ${{ steps.verified.outputs.ghcr_digest }}
          VERSION: ${{ steps.verified.outputs.version }}
          MINOR: ${{ steps.verified.outputs.minor }}
        run: |
          set -eu
          auth="$HOME/.docker/config.json"
          for pair in "$QUAY_IMAGE=$QUAY_DIGEST" "$GHCR_IMAGE=$GHCR_DIGEST"; do
            image=${pair%%=*} digest=${pair#*=}
            # `latest` is the newest stable RELEASE (constitution 1.33.0), so the
            # release moves it -- unless a NEWER release already holds it, which
            # a re-run of an old tag would otherwise demote. This job checks out
            # no git history, so the comparison is on the `version` label the
            # published image carries rather than on ancestry. The regex above
            # has already refused anything but a three-number stable tag.
            #
            # Asked of THIS registry, inside the loop. The two can disagree --
            # one may hold an older release, or no `latest` at all -- and a
            # decision read from Quay and applied to GHCR leaves them
            # inconsistent in exactly the case the guard exists to catch.
            tags="$VERSION $MINOR"
            if current=$(skopeo inspect --format '{{ index .Labels "version" }}' \
                 --authfile "$auth" "docker://$image:latest" 2>"$RUNNER_TEMP/inspect.err"); then
              :
            elif grep -qiE 'manifest unknown|not found|no such' "$RUNNER_TEMP/inspect.err"; then
              # No `latest` yet, so this release is the one that creates it.
              current=
            else
              # Anything else is a failure to READ, not an absent tag. Failing
              # closed matters: an empty `current` means "move it", so a
              # swallowed network error would let a re-run of an old tag demote
              # the registry -- the thing the guard is here to prevent.
              cat "$RUNNER_TEMP/inspect.err" >&2
              echo "cannot read $image:latest; nothing is retagged" >&2
              exit 1
            fi
            if [ -n "$current" ] && [ "$current" != "$VERSION" ] &&
               [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" = "$current" ]; then
              echo "::notice::$image:latest is $current, newer than $VERSION; moving the version tags only"
            else
              tags="$tags latest"
            fi
            for tag in $tags; do
              skopeo copy --all --preserve-digests --authfile "$auth" \
                "docker://$image@$digest" "docker://$image:$tag"
              got=$(skopeo inspect --raw --authfile "$auth" "docker://$image:$tag" | sha256sum | cut -d' ' -f1)
              [ "sha256:$got" = "$digest" ] || {
                echo "$image:$tag resolves to sha256:$got, not the recorded $digest" >&2
                exit 1
              }
            done
          done

      - name: What was released
        env:
          VERSION: ${{ steps.verified.outputs.version }}
          QUAY_DIGEST: ${{ steps.verified.outputs.quay_digest }}
          GHCR_DIGEST: ${{ steps.verified.outputs.ghcr_digest }}
        run: |
          {
            echo "### Promoted, not rebuilt"
            echo
            echo "| Tag | Digest |"
            echo "|---|---|"
            echo "| \`$QUAY_IMAGE:$VERSION\` | \`$QUAY_DIGEST\` |"
            echo "| \`$GHCR_IMAGE:$VERSION\` | \`$GHCR_DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"
