# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). The merge to main does not
# rebuild: it promotes the pull request's gated digest to :main, and a v* tag
# copies main's digest to the version tags and :latest. Quay.io only.
#
# All of the logic lives in crunchtools/constitution's container-release.yml,
# as in every other image repo. `security.yml`'s `sdlc ci` still builds the
# image to run the in-image tests; it publishes nothing.

name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "41 4 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  # The Containerfile takes its `version` label from a build argument, and
  # promote refuses a release whose label names another release (#171), so the
  # build gets the version of the commit it builds.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: v
        run: python3 -I -c 'import tomllib; print("version=" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' >> "$GITHUB_OUTPUT"

  container:
    needs: version
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.53.0
    permissions:
      contents: read
      issues: write   # the alert job files a failed schedule as an issue
      pull-requests: read
    with:
      image: quay.io/crunchtools/trentina
      build-args: VERSION=${{ needs.version.outputs.version }}
      boot: mcp
      # stdio, no gateway: Trentina's own tools, which list without any key.
      # /data is a volume in production.
      boot-run-args: --tmpfs /data:mode=1777
      # Hosts refuse an unsigned quay.io/crunchtools image
      # (crunchtools/rhel10-bootc-server#47). Promote signs the gated digest
      # before any tag moves, with the key from this repo's cosign-signing
      # environment (main and v* only); without it promote refuses.
      sign: true
      # crunchtools/data-collector builds FROM this image; constitution's
      # validate-cascade requires the edge.
      downstream: data-collector
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      CRUNCHTOOLS_CI_APP_KEY: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
