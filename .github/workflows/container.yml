name: Container Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QUAY_IMAGE: quay.io/crunchtools/trentina
  GHCR_IMAGE: ghcr.io/crunchtools/trentina

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # The version belongs to the package, not to the ref that triggered the
      # build. docker/metadata-action's `version` output is the BRANCH NAME on a
      # branch push (so main builds labelled themselves "main"); the semver only
      # appears on tag pushes. Read pyproject.toml, which is the single source.
      # This step runs BEFORE the metadata so its value can overwrite the label.
      - name: Read package version
        id: pkgver
        run: |
          v=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          [ -n "$v" ] || { echo "could not read version from pyproject.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.QUAY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          # Overwrites the generated OCI version label, which is the ref on a
          # branch push. The Containerfile's own `version` label already came
          # from the build-arg below; this makes the two agree.
          labels: |
            org.opencontainers.image.version=${{ steps.pkgver.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.pkgver.outputs.version }}

      # The crunchtools-ci App's token, not a personal one: it has its own rate
      # limit, so a throttled account can't stop this step.
      - name: Mint CI token
        id: ci-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CRUNCHTOOLS_CI_APP_ID || secrets.CRUNCHTOOLS_CI_APP_ID }}
          private-key: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
          owner: crunchtools

      # crunchtools/data-collector is built FROM this image. Tell it to
      # rebuild, as every parent image in the fleet tells its children
      # (crunchtools/constitution, validate-cascade.py).
      - name: Trigger downstream rebuilds
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          for repo in data-collector; do
            gh api repos/crunchtools/$repo/dispatches \
              -f event_type=parent-image-updated \
              || echo "::warning::$repo was not told to rebuild; start its build by hand"
          done

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.QUAY_IMAGE }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # The version belongs to the package, not to the ref that triggered the
      # build. docker/metadata-action's `version` output is the BRANCH NAME on a
      # branch push (so main builds labelled themselves "main"); the semver only
      # appears on tag pushes. Read pyproject.toml, which is the single source.
      # This step runs BEFORE the metadata so its value can overwrite the label.
      - name: Read package version
        id: pkgver
        run: |
          v=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          [ -n "$v" ] || { echo "could not read version from pyproject.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          # Overwrites the generated OCI version label, which is the ref on a
          # branch push. The Containerfile's own `version` label already came
          # from the build-arg below; this makes the two agree.
          labels: |
            org.opencontainers.image.version=${{ steps.pkgver.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.pkgver.outputs.version }}

