# The attack-sim demo served at crunchtools.com/wic-catalogue/ (#273), released
# through constitution's container-release.yml like every other image. Its own
# path filter: nothing outside demo/attack-sim/ goes into it.
#
# No v* tags: the demo is never released, so it has no `latest` (constitution
# 1.33.0). Gloval runs `:main`, which a merge touching the demo promotes.

name: Demo container

on:
  pull_request:
    paths:
      - "demo/attack-sim/**"
      - ".github/workflows/demo-container.yml"
  push:
    branches: [main]
    paths:
      - "demo/attack-sim/**"
      - ".github/workflows/demo-container.yml"
  schedule:
    - cron: "47 4 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.53.0
    permissions:
      contents: read
      issues: write   # the alert job files a failed schedule as an issue
      pull-requests: read
    with:
      image: quay.io/crunchtools/trentina-demo
      context: demo/attack-sim
      containerfile: demo/attack-sim/Containerfile
      boot: command
      # No HEALTHCHECK in the image: it must answer / and /info.
      boot-command: |
        name=demo-gate-$$
        podman run -d --rm --name "$name" -p 127.0.0.1:8097:8097 "$IMAGE" >/dev/null
        trap 'podman logs "$name" 2>&1 | tail -20; podman rm -f "$name" >/dev/null' EXIT
        for _ in $(seq 60); do
          if curl -fs -o /dev/null http://127.0.0.1:8097/ && curl -fs -o /dev/null http://127.0.0.1:8097/info; then
            echo "trentina-demo answers / and /info"
            exit 0
          fi
          sleep 1
        done
        echo "trentina-demo never answered on 8097" >&2
        exit 1
      sign: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
