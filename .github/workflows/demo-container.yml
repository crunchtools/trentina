name: Demo Container Build & Push

# The attack-sim demo served at crunchtools.com/wic-catalogue/ (#273). It used
# to be built on the host, so a prune lost it for good. Built here, on its own
# path filter: nothing outside demo/attack-sim/ goes into it.

on:
  push:
    branches: [main]
    paths:
      - "demo/attack-sim/**"
      - ".github/workflows/demo-container.yml"
  pull_request:
    branches: [main]
    paths:
      - "demo/attack-sim/**"
      - ".github/workflows/demo-container.yml"
  workflow_dispatch:

env:
  QUAY_IMAGE: quay.io/crunchtools/trentina-demo
  GHCR_IMAGE: ghcr.io/crunchtools/trentina-demo

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.QUAY_IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,format=long
            # `main`, and no `latest`. The demo is cut from `demo/attack-sim` on
            # a push to main and is never released, so it has no newest release
            # for `latest` to name (constitution 1.33.0). The unit on gloval
            # names `:main`, which is what it was always actually tracking.
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: demo/attack-sim
          file: demo/attack-sim/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trentina-demo
          cache-to: type=gha,mode=max,scope=trentina-demo

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: demo/attack-sim
          file: demo/attack-sim/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trentina-demo
          cache-to: type=gha,mode=max,scope=trentina-demo
