name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every version `requires-python` admits, INCLUDING the one the
        # container runs. CI previously tested 3.11 and 3.12 -- neither of
        # which is production (the Containerfile is on 3.14), while the
        # advertised 3.10 floor could not be installed at all. An untested
        # floor and an untested production version are how issue #100 happened.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked fails the run if uv.lock is stale or missing rather than
      # silently re-resolving. Without it a committed lockfile is decoration:
      # CI would still drift on a transitive release and the green check would
      # describe a dependency set nobody chose. See issue #79.
      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run linter
        run: uv run ruff check src tests corpora

      - name: Run type checker
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest -v
        env:
          GEMINI_API_KEY: "test_key_for_ci"

  live-l3:
    name: Live L3 Detection (OpenRouter)
    # Push to main only, as boundary-review-eval below: the test runs the
    # checked-out code with the key in its environment, and a PR branch is the
    # code nobody has reviewed yet.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Single-version job: pinned to the NEWEST supported Python, which is
      # what the container runs. Anything that cannot run across the whole
      # matrix is tested on production's version. See constitution III.
      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # Runs the corpus attacks through a live model on OpenRouter, production's
      # L3 provider, and fails only on a genuine detection regression. Without
      # the key (fork PRs) it says so instead of passing silently; it skips
      # itself as inconclusive on a provider outage.
      - name: No key, no live L3
        if: env.HAS_OPENROUTER_KEY != 'true'
        run: echo "::warning::live L3 not run - OPENROUTER_API_KEY is not available to this run"

      - name: Run live L3 detection
        if: env.HAS_OPENROUTER_KEY == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRENTINA_LIVE_L3: "1"
          TRENTINA_LIVE_L3_PROVIDER: openrouter
          QUARANTINE_MODEL: "google/gemini-2.5-flash"
        run: uv run pytest tests/test_l3_live.py -v

  boundary-review-eval:
    name: Boundary Review Eval (#90)
    runs-on: ubuntu-latest
    # Sends SKILL.md and each fixture to the Anthropic API and grades the
    # findings against EVAL.yml (tests/boundary_review_eval.py). Spends money,
    # so it runs only with the key AND only when the reviewed surface, the
    # skill or its fixtures changed. Otherwise it passes with a notice.
    #
    # Push to main only, never a pull request: the eval executes the checked
    # out code with the key in its environment, and a PR branch is exactly the
    # code nobody has reviewed yet. Merged code is. The offline half (EVAL.yml
    # shape, the grader, a mocked run) is in the test job on every PR.
    if: github.event_name == 'push'
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      BASE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the reviewed surface change?
        id: surface
        run: |
          surface='^(src/|\.claude/skills/trentina-boundary-review/|tests/fixtures/boundary-review/|tests/boundary_review_eval\.py$)'
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qE "$surface"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skipped
        if: env.HAS_ANTHROPIC_KEY != 'true' || steps.surface.outputs.changed != 'true'
        env:
          CHANGED: ${{ steps.surface.outputs.changed }}
        run: >-
          echo "::notice::boundary-review eval skipped
          (ANTHROPIC_API_KEY set: $HAS_ANTHROPIC_KEY; surface changed: $CHANGED)"

      - name: Install uv
        if: env.HAS_ANTHROPIC_KEY == 'true' && steps.surface.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # Dependencies install without the key: no install hook ever sees it.
      - name: Install dependencies
        if: env.HAS_ANTHROPIC_KEY == 'true' && steps.surface.outputs.changed == 'true'
        run: |
          uv python install 3.14
          uv sync --all-extras --locked

      - name: Run the eval
        if: env.HAS_ANTHROPIC_KEY == 'true' && steps.surface.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --no-sync python tests/boundary_review_eval.py --json-out boundary-review-eval.json

      - name: Upload eval results
        if: always() && hashFiles('boundary-review-eval.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: boundary-review-eval
          path: boundary-review-eval.json
          retention-days: 30

  gourmand:
    name: Code Quality (Gourmand)
    uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0.15.3

  build-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build container image
        run: |
          docker build -f Containerfile -t trentina:test .

      - name: Verify container starts
        run: |
          timeout 5 docker run --rm trentina:test || true

      # The real test of a native wheel in a distroless image. The runtime
      # stage copies only site-packages plus libstdc++, so an extension
      # needing a shared object from anywhere else fails here and nowhere
      # else -- which is exactly how onnxruntime broke once already.
      - name: Verify native extensions import in the distroless image
        run: |
          docker run --rm --entrypoint python trentina:test -c "
          import onnxruntime, vodozemac
          print('onnxruntime', onnxruntime.__version__)
          print('vodozemac imported')
          import cv2, PIL, pypdf, rapidocr, shapely, pyclipper
          print('opencv', cv2.__version__, 'pillow', PIL.__version__, 'pypdf', pypdf.__version__)
          "

      - name: Build test runner image (adds shell + pytest to distroless)
        run: |
          docker build -f - -t trentina:test-runner . <<'EOF'
          FROM quay.io/hummingbird/python:latest-builder AS test-deps
          USER 0
          RUN pip install --no-cache-dir --prefix=/usr pytest pytest-asyncio

          FROM trentina:test
          COPY --from=test-deps /usr/lib/python3.14/site-packages/ /usr/lib/python3.14/site-packages/
          EOF

      # Once per model the image ships (#350). TRENTINA_REQUIRE_L2_MODEL makes
      # a model that fails to load FAIL the run: until 0.55.0 this step named
      # a path the image never had, and every L2 test here skipped. The
      # corpus's own L2 annotations run here too: outside the image they
      # always skip, and one went stale under the 0.55.0 default (#353).
      - name: Run L2 integration tests in container
        run: |
          for model in prompt-injection-guard-small; do
            echo "::group::L2 integration: $model"
            docker run --rm \
              --entrypoint python \
              -v ${{ github.workspace }}/tests:/tests:ro \
            -v ${{ github.workspace }}/corpora:/corpora:ro \
              -v ${{ github.workspace }}/corpora:/corpora:ro \
              -e GEMINI_API_KEY="test_key_for_ci" \
              -e CLASSIFIER_MODEL="$model" \
              -e TRENTINA_REQUIRE_L2_MODEL=1 \
              trentina:test-runner \
              -m pytest /tests/test_l2_integration.py \
                "/tests/test_adversarial_corpus.py::TestLayer2Boundary" -v
            echo "::endgroup::"
          done

      # The provider is mocked (fixture responses), so no real key: gating this
      # on a Gemini secret the repo never had meant it never ran.
      - name: Run L3 integration tests in container
        run: |
          docker run --rm \
            --entrypoint python \
            -v ${{ github.workspace }}/tests:/tests:ro \
            -v ${{ github.workspace }}/corpora:/corpora:ro \
            -e GEMINI_API_KEY="test_key_for_ci" \
            trentina:test-runner \
            -m pytest /tests/test_l3_integration.py -v

      # The real OCR and PDF workers, as child processes of the distroless
      # image, with no network, a read-only root and no capabilities, as
      # production runs them (#369, #370). Outside the image these tests
      # prove the code; only here do they prove that OpenCV, Pillow and the
      # models load without a shell, a writable disk or a download. /tmp is
      # for pytest's own files: the workers write nothing.
      - name: Run the OCR and PDF workers in the container
        run: |
          docker run --rm \
            --network none --read-only --tmpfs /tmp --cap-drop=all \
            --security-opt no-new-privileges \
            --entrypoint python \
            -v ${{ github.workspace }}/tests:/tests:ro \
            -v ${{ github.workspace }}/corpora:/corpora:ro \
            -e GEMINI_API_KEY="test_key_for_ci" \
            trentina:test-runner \
            -m pytest -p no:cacheprovider /tests/test_unpack_ocr.py /tests/test_unpack_pdf.py -v
