# Drop in as .github/workflows/constitution.yml. See constitution.md VII.
#
# The tag below is the constitution version this repo is judged by. It moves
# together with `Inherits:` in .specify/memory/constitution.md (scripts/fleet-bump.py
# opens that PR); Dependabot is told to ignore it, see examples/dependabot.yml.
# Required check: `Constitution / Validate constitution`.

name: Constitution

on:
  pull_request:
  push:
    branches: [main, master]

# A new push supersedes the run it interrupts, on a PR only (#662 follow-up).
# Without this, four pushes to one branch left four complete sets of runs
# grinding to completion -- three image builds and a four-way test matrix each.
#
# Main and tag pushes get `false`, so they QUEUE instead of cancelling. A
# cancelled publish can leave a half-pushed manifest and a downstream that was
# never told to rebuild; waiting is cheaper than reconciling that.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  constitution:
    name: Constitution
    uses: crunchtools/constitution/.github/workflows/validate.yml@v1.28.0
