name: Mutation (advisory)

# mutmut over the security modules (#858): the code where a test that passes
# for the wrong reason costs most. scripts/mutation_advisory.py holds the scope
# (MODULES, each with the tests that own it) and writes the surviving mutants to
# the job summary.
#
# ADVISORY. continue-on-error, and not a required check: a survivor is a
# question for a person -- a missing assertion, or an equivalent mutant -- and a
# red check that means "maybe" teaches people to ignore red checks.
#
# A pull request mutates only the modules it touches, or whose owning tests it
# touches. The weekly run mutates all of them, so a gap that no PR touches is
# still seen.

on:
  pull_request:
    branches: [main]
    paths:
      - src/trentina/gateway/guards.py
      - src/trentina/gateway/approver.py
      - src/trentina/gateway/pending.py
      - src/trentina/gateway/egress_policy.py
      - src/trentina/gateway/auth.py
      - src/trentina/tools/confine.py
      - src/trentina/quarantine/schema.py
      - src/trentina/quarantine/providers/base.py
      - src/trentina/reach/egress.py
      - tests/test_gateway_guards.py
      - tests/test_approvals.py
      - tests/test_approval_passkeys.py
      - tests/test_approval_state_machine.py
      - tests/test_egress_policy.py
      - tests/test_gateway_auth.py
      - tests/test_read_confinement.py
      - tests/test_shadow_confinement.py
      - tests/test_l3_schema.py
      - tests/test_provider_fallback.py
      - tests/test_provider_no_tools.py
      - tests/test_l3_limiter.py
      - tests/test_egress.py
      - tests/test_client_egress.py
      - tests/test_egress_encoding.py
      - scripts/mutation_advisory.py
      - .github/workflows/mutation-advisory.yml
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny: the job reads the repository and nothing else. The report is
# the job summary and an artifact, so it needs no write to the pull request.
permissions: {}

jobs:
  mutmut:
    name: mutmut (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    # The script stops mutmut at --budget-minutes and still reports what it
    # checked; this is the backstop above it.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base, to list what the pull request changed.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Mutate the changed security modules
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GEMINI_API_KEY: test_key_for_ci
        run: |
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed"
          xargs -d '\n' -a "$RUNNER_TEMP/changed" \
            uv run --with mutmut==3.8.1 python scripts/mutation_advisory.py \
            --budget-minutes 40 --changed

      - name: Mutate every security module
        if: github.event_name != 'pull_request'
        env:
          GEMINI_API_KEY: test_key_for_ci
        run: >-
          uv run --with mutmut==3.8.1 python scripts/mutation_advisory.py
          --budget-minutes 45 --all

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutation-report/
          if-no-files-found: ignore
          retention-days: 30
