name: L2 - fine-tune

# Fine-tune the shipped L2 model (Horizon) on benign and attack text in real
# tool-reply envelopes, then hold the result to every L2 gate (#17, gaps 24,
# 28, 31). The shipped model refuses benign tool replies because it never saw
# one: scripts/l2_train_data.py builds the missing half from pinned public
# sets, wrapping attacks in the same envelopes so the label follows the text.
#
# The model is an artifact of this run, not a release. With publish, on main, the full
# fine-tune, once it has passed every gate below, is also pushed and signed as an image
# (quay.io/crunchtools/trentina-l2-model); shipping it is a Containerfile
# change that pins its digest, made after a screen on production shapes.
#
# Training runs on one RunPod Secure Cloud RTX 4090 (scripts/runpod_train.py),
# the card the recipe was found on; the runner builds the data, exports and
# gates. That runner is our own uncached one when UNCACHED_RUNNER_LABEL is
# set (the CPU gates took 15 of a run's 26 minutes on GitHub's), and clearing
# it moves the job back to GitHub-hosted. Only a hand dispatch reaches this
# job, so no fork or Dependabot code runs there. Containers are podman,
# rootless on both, so what they write is the runner user's and no step
# needs sudo. RUNPOD_API_KEY lives in the `runpod` environment, which releases it
# only to this job, dispatched by hand on main or feature/l2-* (deployment
# branch policy): no push, pull request or fork run ever sees it. The pod
# gets only public datasets and the public base model.

on:
  workflow_dispatch:
    inputs:
      per_envelope:
        description: "Benign rows per envelope (each with an attack twin)"
        type: number
        default: 120
      replay:
        description: "Plain benign rows, and plain attack rows"
        type: number
        default: 1000
      epochs:
        description: "Training epochs"
        type: string
        default: "2"
      publish:
        description: "Push the full fine-tune, if it passes every gate, as quay.io/crunchtools/trentina-l2-model"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  train:
    runs-on: ${{ vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment: runpod
    env:
      PER_ENVELOPE: ${{ inputs.per_envelope || 120 }}
      REPLAY: ${{ inputs.replay || 1000 }}
      EPOCHS: ${{ inputs.epochs || '2' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv python install 3.14
          uv sync --all-extras --locked
          # The data builder reads parquet and the hub; neither is a gateway dependency.
          uv pip install pandas pyarrow huggingface_hub

      - name: Build the training set
        run: |
          for size in "$PER_ENVELOPE" "$REPLAY"; do
            # Ten and up: one row in ten of each is validation.
            [[ "$size" =~ ^[1-9][0-9]+$ ]] || { echo "sizes must be whole numbers from 10" >&2; exit 1; }
          done
          uv run --no-sync python scripts/l2_train_data.py --out build/l2-train --per-envelope "$PER_ENVELOPE" --replay "$REPLAY"

      - name: Build the model-builder stage
        run: podman build --target model-builder -t l2-builder -f Containerfile .

      - name: Start the GPU pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 scripts/runpod_train.py create

      - name: Fine-tune on the pod
        run: |
          # EPOCHS is a dispatch input: checked as a number here, and parsed as
          # a float by runpod_train.py before it reaches the pod.
          [[ "$EPOCHS" =~ ^[0-9]*[.]?[0-9]+$ && ! "$EPOCHS" =~ ^[0.]+$ ]] \
            || { echo "epochs must be a number above zero" >&2; exit 1; }
          python3 scripts/runpod_train.py run --host "$POD_HOST" --port "$POD_PORT" --epochs "$EPOCHS"

      - name: Terminate the pod
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 scripts/runpod_train.py terminate --pod "${POD_ID:-}"

      # The full fine-tune (blend 1), and any blend back toward Horizon that
      # train_l2_model.py wrote (blend-<a>, only with --blends), side by side.
      - name: Export
        run: |
          shopt -s nullglob  # no blend-* without --blends
          for src in build/l2-model build/l2-model/blend-*; do
            name=$(basename "$src"); [[ "$name" == l2-model ]] && name=blend-1
            podman run --rm --security-opt label=disable -v "$PWD:/w" -w /w l2-builder \
              python scripts/export_l2_model.py \
              --src "$src" --repo "crunchtools/trentina:l2-train" --revision "$GITHUB_SHA" \
              --out "build/l2-export/$name" --id prompt-injection-guard-small-ct --license Apache-2.0 \
              --threshold 0.5 --window-tokens 512 --malicious-labels INJECTION
            cp "$src/training.json" "build/l2-export/$name/"
            cp scripts/l2-model-NOTICE "build/l2-export/$name/NOTICE"
          done

      # Every blend meets every gate; the run passes when one blend passes all.
      # Which one ships is chosen after the screen on production shapes, from
      # those that pass: no shape may flag more often than under Horizon.
      - name: Gates
        run: |
          set -o pipefail
          passed=0
          for model in build/l2-export/blend-*; do
            [[ -d "$model" ]] || continue
            # The three gates at once, four threads each: twelve, the
            # runner's CPU quota. Reported in a fixed order once all are in.
            for gate in l2_benign l2_envelopes l2_obfuscation; do
              CLASSIFIER_THREADS=4 CLASSIFIER_MODEL_PATH="$model" uv run --no-sync \
                python "benchmarks/$gate.py" > "$model.$gate.log" 2>&1 &
            done
            status=0
            for job in $(jobs -p); do wait "$job" || status=1; done
            echo "# $(basename "$model")" | tee -a "$GITHUB_STEP_SUMMARY"
            for gate in l2_benign l2_envelopes l2_obfuscation; do
              echo "## $gate" | tee -a "$GITHUB_STEP_SUMMARY"
              grep -v '^transform:' "$model.$gate.log" | tee -a "$GITHUB_STEP_SUMMARY"
            done
            echo "$(basename "$model"): $([[ $status == 0 ]] && echo pass || echo FAIL)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            [[ $status == 0 ]] && passed=1 && touch "$model.passed"
          done
          [[ $passed == 1 ]]

      # For screening on production shapes, which never leave the host they
      # came from, before a Containerfile change pins a model. A derivative of
      # Apache-2.0 and CC-BY-4.0 work, so it carries NOTICE and training.json
      # (every source, revision and hash); kept a week, not published.
      - name: Upload the model
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l2-model
          path: build/l2-export
          retention-days: 7

  # Its own job, so the only one holding packages: write runs no repo code and
  # touches nothing the pod sent except the export the gates passed. It is
  # also the only one holding the signing key: the `cosign-signing`
  # environment releases it to main only, as for container-release.yml.
  publish:
    needs: train
    # Default branch only (constitution VII): a dispatch on feature/l2-* trains
    # and gates, but never publishes.
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cosign-signing
    permissions: {}
    env:
      IMAGE: quay.io/crunchtools/trentina-l2-model
    steps:
      # Registry auth lives in RUNNER_TEMP and is removed at the end, so no
      # credential outlives the job in the runner's home (#842).
      - name: Keep registry auth inside this job
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: l2-model
          path: export

      # The one model the recipe ships, and only once it has passed every gate:
      # the export as gated (manifest, NOTICE, training.json), nothing else.
      # Nothing in it runs; the scratch image only carries the files.
      - name: Check the full fine-tune passed every gate
        run: |
          [[ -e export/blend-1.passed ]] \
            || { echo "the full fine-tune did not pass every gate" >&2; exit 1; }
          printf 'FROM scratch\nCOPY blend-1/ /model/\n' > export/Containerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: export
          file: export/Containerfile
          push: true
          tags: quay.io/crunchtools/trentina-l2-model:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      # The same cosign, checked by the same sha256, as container-release.yml.
      - name: Install cosign v2.6.5
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  $RUNNER_TEMP/cosign" | sha256sum -c
          install -D -m 0755 "$RUNNER_TEMP/cosign" "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Hosts refuse an unsigned quay.io/crunchtools image
      # (crunchtools/rhel10-bootc-server#47), and trentina's build pulls this
      # one. The key and password reach cosign only through env. The public
      # half is constitution's keys/crunchtools-bootc.pub, inlined because this
      # job checks out nothing; the key is refused unless it matches.
      - name: Sign the pushed digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PUB: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE5TlIf0f5VMBaCLJGtmh9fL3C/xYM
            nHVNg0KnBqqs/x+WThX8zEKaGmiZ2SM5336mPfJKZl68/lXBnoWlU0E9Tg==
            -----END PUBLIC KEY-----
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the digest to sign is not a sha256 digest" >&2; exit 1; }
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "::error::no COSIGN_PRIVATE_KEY from the cosign-signing environment" >&2; exit 1; }
          printf '%s\n' "${PUB%$'\n'}" > "$RUNNER_TEMP/crunchtools-bootc.pub"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/secret.pub"
          cmp -s "$RUNNER_TEMP/secret.pub" "$RUNNER_TEMP/crunchtools-bootc.pub" || { echo "::error::COSIGN_PRIVATE_KEY is not the private half of keys/crunchtools-bootc.pub" >&2; exit 1; }
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign verify --insecure-ignore-tlog --key "$RUNNER_TEMP/crunchtools-bootc.pub" "$IMAGE@$DIGEST" >/dev/null
          echo "::notice::signed $IMAGE@$DIGEST"

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published and signed \`$IMAGE@$DIGEST\`" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Drop registry auth
        if: always()
        run: rm -rf "$RUNNER_TEMP/auth.json" "$RUNNER_TEMP/docker"
