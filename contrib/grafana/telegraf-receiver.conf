# Telegraf as an OTLP/HTTP receiver for Trentina's call traces, writing to
# InfluxDB 2.x for contrib/grafana/trentina-dashboard.json.
# See docs/grafana-dashboard.md.
#
# Run it as its own Telegraf, on a network Trentina can reach, with no host
# access: it answers requests, so it should hold nothing but a write token.
# Environment: INFLUX_URL, INFLUX_TOKEN (write-only), INFLUX_ORG,
# INFLUX_BUCKET, OTLP_USERNAME, OTLP_PASSWORD.
#
# Telegraf's own OpenTelemetry input speaks gRPC only, so Trentina sends
# OTLP/HTTP with JSON encoding to http_listener_v2 and an xpath parser maps
# each span to one `trentina_calls` point. The attributes are Trentina's
# closed-set call metadata (docs/telemetry.md), never caller-chosen text.
# Tested with Telegraf 1.38 and 1.40.

[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  # Two calls with the same tags must not share a timestamp, or InfluxDB keeps
  # only the last: keep the span's own nanoseconds.
  precision = "1ns"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[inputs.http_listener_v2]]
  service_address = ":4318"
  paths = ["/v1/traces"]
  methods = ["POST"]
  basic_username = "${OTLP_USERNAME}"
  basic_password = "${OTLP_PASSWORD}"
  max_body_size = "16MB"
  read_timeout = "10s"
  write_timeout = "10s"
  data_format = "xpath_json"
  xpath_native_types = true

  # In xpath_json an array's items are the children of its node, so a span
  # is //scopeSpans/*/spans/* and an attribute is attributes/*[key='...'].
  [[inputs.http_listener_v2.xpath]]
    metric_name = "'trentina_calls'"
    metric_selection = "//scopeSpans/*/spans/*"
    timestamp = "endTimeUnixNano"
    timestamp_format = "unix_ns"

    [inputs.http_listener_v2.xpath.tags]
      profile = "attributes/*[key='trentina.profile']/value/stringValue"
      backend = "attributes/*[key='trentina.backend']/value/stringValue"
      tool = "attributes/*[key='gen_ai.tool.name']/value/stringValue"
      outcome = "attributes/*[key='trentina.outcome']/value/stringValue"
      destination_kind = "attributes/*[key='trentina.destination_kind']/value/stringValue"
      layer = "attributes/*[key='trentina.layer']/value/stringValue"
      risk = "attributes/*[key='trentina.risk']/value/stringValue"
      l3_verdict = "attributes/*[key='trentina.l3_verdict']/value/stringValue"

    [inputs.http_listener_v2.xpath.fields]
      duration_ms = "number(attributes/*[key='trentina.duration_ms']/value/intValue)"
      bytes_arrived = "number(attributes/*[key='trentina.bytes_arrived']/value/intValue)"
      bytes_delivered = "number(attributes/*[key='trentina.bytes_delivered']/value/intValue)"
      success = "attributes/*[key='trentina.success']/value/boolValue = 'true'"
      trace_id = "string(traceId)"
