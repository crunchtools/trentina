[project]
name = "trentina"
version = "2.1.0"
description = "MCP gateway for AI agents — prompt-injection defense, token savings, deterministic policy, OAuth, per-agent profiles"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "crunchtools.com" }
]
readme = "README.md"
keywords = ["mcp", "mcp-gateway", "security", "prompt-injection", "oauth", "token-efficiency", "agents", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=4.0,<5.0",
    # The MCP SDK is a DIRECT dependency, not one inherited through fastmcp.
    # fastmcp governs how trentina is a server; the SDK governs how it is a
    # client to ~20 backends (gateway/backend.py dials the raw SDK). Leaving
    # the SDK implicit let the server framework silently pick the client's
    # protocol stack, which made the gateway the version ceiling for its own
    # fleet. Bound them separately so each side can move on its own.
    "mcp>=2.2,<3.0",
    # Direct, not through fastmcp: gateway/backend_tokens.py encrypts the
    # per-profile backend grants itself (#479), with its own envelope rather
    # than fastmcp's store, so it must not depend on fastmcp keeping either.
    "cryptography>=44",
    "py-key-value-aio>=0.4.6,<0.5",
    # petit, as a library — preprocess/petit.py's line grouping.
    #
    # The DISTRIBUTION is petit-log-crunchtools; the IMPORT is `petit`. It has
    # been renamed twice: 3.0.0 moved it from `crunchtools` to `petit-log`,
    # and 3.1.1 moved it again to satisfy a PyPI trusted-publisher rule. Get
    # this wrong and uv fails with "package metadata name does not match",
    # which is a clearer error than most but says nothing about which name is
    # right — hence this comment rather than a bare pin.
    #
    # 4.1.1 was the first floor. 4.1.0 is where petit gained the two drivers
    # this package used to carry itself: StructuredHash (JSON records) and
    # EmailHash (mail threads). Below that floor `preprocess/structured.py`
    # and `preprocess/email.py` have no library to delegate to and the
    # grouping they call for silently does not exist.
    # See crunchtools/petit#31 and trentina#95.
    #
    # 4.10.0 added pull_identifiers, which `preprocess/structured.py` lists
    # identifier-varying records with (#173). 4.10.2 is the floor now: before
    # it petit logged on the root logger, which gave it a handler and made
    # `logsafe.configure`'s basicConfig a no-op in the bridge (#344).
    "petit-log-crunchtools>=4.10.2",
    "httpx>=0.28",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.14",
    "onnxruntime>=1.17",
    "transformers>=4.40",
    "numpy>=1.24",
    "dbus-fast>=2.0",
    "pyyaml>=6.0",
    "pypdf>=6.19",
    # OCR for images (#370). RapidOCR is Apache-2.0 and ships its three
    # PP-OCR models (31 MB) inside the wheel, so they are hash-pinned by
    # uv.lock like any other file and nothing is fetched at run time.
    # It asks for `opencv-python`, the GUI build, which needs libxcb and does
    # not import in the image; `opencv-python-headless` provides the same
    # `cv2` module without it, and the uv override at the end of this file
    # drops the GUI build from the resolution. Like pypdf, this runs only in
    # a child process (unpack/ocr_worker.py).
    "rapidocr>=3.9",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Matrix end-to-end decryption. Optional on purpose: the gateway installs and
# runs without it, and a deployment that asks for decryption on a platform
# with no wheel then fails at CONFIG LOAD with a clear message instead of at
# request time with a 100% undecryptable rate. vodozemac is the maintained
# Rust implementation -- libolm is deprecated -- and ships prebuilt manylinux
# wheels for cp310-cp315, so no compiler is involved.
matrix = [
    "vodozemac>=0.10,<0.11",
]
# The Matrix bridge (#162, spec 015): the upstream client that holds the
# login, device and crypto store, run from the same image as its own container
# (`python -m trentina.bridge.main run`). Its e2e extra is
# built on vodozemac, the same library as `matrix` above, so the two resolve
# to one copy.
bridge = [
    "matrix-nio[e2e]>=0.26,<0.27",
    # sign-device reads SSSS secrets; also a matrix-nio dependency.
    "unpaddedbase64>=2.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    # A benign out-of-tree transform plugin, the test fixture + worked example
    # for the Phase 6 registry. A dev-only path source: `uv export` for the
    # image names only --extra matrix --extra bridge, so it never reaches the
    # production wheel (and the wheel packages only src/trentina regardless).
    "petit-plus",
]

[project.scripts]
trentina = "trentina:main"
trentina-audit-verify = "trentina.audit_chain:main"
trentina-bridge = "trentina.bridge.main:main"
trentina-rcs-bridge = "trentina.rcs_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trentina"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Known-bad code on purpose: the boundary-review eval (#90) grades a reviewer
# on catching exactly what lint would flag, and semgrep's --test fixtures
# carry a rule's true and false positives.
extend-exclude = ["tests/fixtures/boundary-review", ".semgrep"]
# The pre-commit hook passes files by name; without this ruff lints them anyway.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
# Audited rule by rule (RT #1482) by emptying this list and counting real hits
# against `src` and `tests` separately -- the scope CI lints. PIE790, S105 and
# RUF022 had ZERO hits and were deleted. S101 had 1597 hits, every one of them
# in tests/, and moved to per-file-ignores below; it was never a src concern.
# The seven that remain are all genuinely package-wide in src/.
ignore = [
    "TRY003",   # 100 hits: exception messages built at the raise site
    "TID252",   # 141 hits: this package's own internal relative imports
    "PLC0415",  # 48 hits: deferred CLI imports and optional-dependency imports
                #   (e.g. `from .dbus_interface import start_dbus` only when
                #   --no-dbus is absent), concentrated in __init__ and dbus_interface
    "PLW0603",  # 29 hits: module-level lazy singletons
    "PLR0913",  # 12 hits: MCP tool signatures mirror the wire API
    "PLR2004",  # 10 hits: HTTP status codes and byte limits
    "PLR0917",  # 6 hits: ditto, positional
    "TRY400",   # 11 hits: it asks for logger.exception, whose traceback prints
                #   the exception's message -- a URL, a path, a backend's text.
                #   #262 forbids exactly that; tests/test_log_hygiene.py
                #   enforces the opposite rule.
    "UP042",    # 4 hits: `class X(str, Enum)` -> StrEnum. Surfaced by raising
                #   target-version to py311, not by any code change. Every use
                #   site goes through .value or .name (checked), so the swap
                #   looks safe -- but these enums land in persisted audit rows
                #   (Outcome) and cache keys (Provenance), and StrEnum changes
                #   what str() returns. That is a deliberate migration with its
                #   own blast radius, not fallout from a Python floor bump.
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# S603: the integration tests launch a real MCP backend and a fastmcp-free
# interpreter as subprocesses. Both argv lists are literals naming this repo's
# own modules and sys.executable -- there is no untrusted input to check, and
# the alternative (never starting a real server) is what let a production
# breakage through a green CI run in the first place.
"tests/*" = ["S101", "S105", "S106", "S108", "S311", "S603", "PLC0415", "PLR2004", "ARG002", "ARG005", "RUF003", "PT018", "TC003"]
# RUF001: the Chinese and Japanese cases (#353) use fullwidth punctuation,
# which is what that text is written with; ASCII would make them less real.
"corpora/internal.py" = ["RUF001"]
# S311: the benign corpus (#411) is generated from a fixed seed so that it is
# the same text on every run; nothing in it is a secret.
# ARG005: every shape's maker takes the case index; most do not need it.
"corpora/benign_ops.py" = ["S311", "ARG005"]
# S311: garak's leetspeak swaps letters on a coin toss (#423); seeding the toss
# with the text makes one text one encoding on every run.
"corpora/garak_encodings.py" = ["S311"]
# S311: the #511 request corpus generates its key bodies from a fixed seed, the
# same text every run; nothing in it is a secret.
"corpora/credential_shapes.py" = ["S311"]
# S105: CredentialKind's values are kind NAMES ("github_token", "query_secret"),
# not credentials; S105 reads the "token"/"secret" in them as a hardcoded one.
"src/trentina/credential_shapes.py" = ["S105"]
"src/trentina/dbus_interface.py" = ["UP037", "C901", "TRY300"]
# S603: PDFs are parsed in a child process so a hostile file can be killed
# at a deadline (#369). argv is this interpreter and a constant module name;
# the payload goes in on stdin and is never part of a command.
"src/trentina/unpack/child.py" = ["S603"]
"src/trentina/gateway/app.py" = ["C901", "PLR0911", "PLR0912"]
# Request handler: each early return is a distinct HTTP failure response
# (401, 404, 500, ...). Same shape as gateway/app.py above.
"src/trentina/gateway/alert_ingress.py" = ["PLR0911"]
# _route_tools_call is a chain of fail-closed gates -- backend unknown, tool not
# allowed, parameter guard, backend error, response guard -- and each one returns
# its own refusal. Collapsing them into a single exit would hide which gate fired,
# which is the one thing an operator reading an audit row needs.
"src/trentina/gateway/router.py" = ["PLR0911"]
# E402: the benchmark inserts the repo root on sys.path before importing the
# corpus and package, so those imports intentionally follow that setup.
# PLR0915: render_markdown is a linear report builder — many append statements,
# no real branching. Kept inline (one caller) to satisfy Gourmand's
# single-use-helper rule rather than split into helpers.
"benchmarks/provider_benchmark.py" = ["E402", "PLR0915"]
"benchmarks/l2_obfuscation.py" = ["E402"]
"benchmarks/l2_encodings.py" = ["E402"]
# S106: `bearer_token_env` names an environment variable; it holds no token.
"benchmarks/l2_benign.py" = ["E402", "S106"]
"benchmarks/gatekeeper.py" = ["E402", "S106"]
"benchmarks/l1_briefing.py" = ["E402"]
# E402 and S106 as l2_benign above; S311: envelope texts are drawn from a fixed seed.
"benchmarks/l2_envelopes.py" = ["E402", "S106", "S311"]
# S311: every invented value around an envelope's text comes from the caller's
# fixed-seed Random, so a case is the same text on every run; nothing is a secret.
"corpora/envelopes.py" = ["S311"]
# S106: `bearer_token_env` names an environment variable; it holds no token.
"corpora/gateway_read.py" = ["S106"]
# E402: the script puts the repo root on sys.path before importing corpora.
# S603: git fetches the advisory database at its pinned commit; every argument
# is a constant, the cache path or that commit, none of it from a row.
"scripts/l2_train_data.py" = ["E402", "S311", "S603"]
# S603: ssh-keygen, ssh and tar drive the training pod; every argument is a
# constant, the runner's temp path, or the host and port RunPod's API returned.
# S310: urlopen only ever gets API, a constant https URL, plus a pod id.
"scripts/runpod_train.py" = ["S310", "S603"]
"benchmarks/redact_input.py" = ["E402"]
"benchmarks/l1_false_positives.py" = ["E402"]
"benchmarks/unpack_archives.py" = ["E402"]
"benchmarks/prompt_pack.py" = ["E402"]
"benchmarks/decoy_tools.py" = ["E402"]
"benchmarks/detonation.py" = ["E402"]
"benchmarks/wild_feed.py" = ["E402"]
"benchmarks/l2_lone_flag.py" = ["E402"]
"benchmarks/credential_shapes.py" = ["E402"]
"benchmarks/paging_l3.py" = ["E402"]
"benchmarks/egress_bench.py" = ["E402", "S106"]
# S311: a seeded generator makes the blob samples reproducible; nothing here is a secret.
"benchmarks/l2_blob_length.py" = ["E402", "S311"]

[tool.mypy]
# NOT the 3.11 floor, deliberately. numpy's bundled stubs use PEP 695 `type X =`
# syntax, which mypy refuses to parse under python_version = "3.11":
#   numpy/__init__.pyi: error: Type statement is only supported in Python 3.12
#   and greater  [syntax]
# That is a blocking error, so type checking stops entirely. 3.11 compatibility
# is instead enforced where it actually bites -- ruff's target-version = py311,
# and the CI matrix running the full suite on 3.11, which would fail at import
# on any 3.12-only syntax.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["markdownify", "bs4", "onnxruntime", "transformers", "dbus_fast", "dbus_fast.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ocr: runs the real OCR worker, a child process that loads the PP-OCR models",
]

# petit-log ships no type information — it is a long-lived tool whose library
# surface was added recently and whose internals carry no annotations. Only
# preprocess/petit.py imports it.
[[tool.mypy.overrides]]
module = ["petit", "petit.*"]
ignore_missing_imports = true

# matrix-nio ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["nio", "nio.*"]
ignore_missing_imports = true

[tool.uv]
# rapidocr requires `opencv-python`; we install `opencv-python-headless`
# instead (see the dependency comment above). A marker that is never true
# removes the GUI build from every resolution.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

# Security floors on TRANSITIVE dependencies (both arrive through fastmcp:
# authlib directly, dnspython via pydantic[email] -> email-validator). These
# are constraints, not direct dependencies — we do not import either; we only
# refuse to resolve a version with a known CVE. authlib is the OAuth/JWT stack
# behind the gateway's proxy auth, so its advisories are load-bearing here.
#   authlib < 1.9.0:  CVE-2026-96760, -114615, -114617, -114618, -114620
#   dnspython < 2.9.0: CVE-2026-114605
# Raise each floor (never lower it) as fixes land; drop a line only once no
# resolvable version is affected.
constraint-dependencies = ["authlib>=1.9.0", "dnspython>=2.9.0"]

[tool.uv.sources]
# The Phase 6 transform-plugin test fixture, resolved from the repo, never from
# an index. Dev-only (see the `dev` extra); excluded from the container image.
petit-plus = { path = "tests/fixtures/plugins/petit_plus" }
