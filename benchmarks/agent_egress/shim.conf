# The bench's fetch adapter sends no credential; this adds the bench profile's
# bearer so /proxy/forward keeps the auth production runs. Nothing else changes.
worker_processes 1;
pid /tmp/nginx.pid;
events {}
http {
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  access_log off;
  server {
    listen 127.0.0.1:18899;
    location / {
      proxy_pass http://127.0.0.1:8000/proxy/forward/bench/;
      proxy_set_header Authorization "Bearer @BENCH_TOKEN@";
      proxy_buffering off;
      proxy_read_timeout 120s;
    }
  }
}
