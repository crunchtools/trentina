[project]
name = "petit-plus"
version = "0.1.0"
description = "A benign out-of-tree Trentina transform plugin, used as a test fixture and as the worked example of the public contract."
requires-python = ">=3.11"
dependencies = []

# The whole point of the fixture: a distribution exposes a transform by naming
# a factory in the versioned group. An operator install makes `petit-plus:dedupe`
# nameable by a profile; nothing is loaded from a path at run time.
[project.entry-points."trentina.transforms.v1"]
dedupe = "petit_plus:make"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["petit_plus"]
