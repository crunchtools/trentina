# The README demo's gateway: one assistant profile in front of a Google
# Workspace backend (backend.py) and Trentina's own content tools.
#
# It may read and draft mail, and send only to its owner. The defense default
# is block, and the agent may also ask for redact.

llm_providers:               # a profile's llm_keys must name one of these
  openrouter:
    enabled: true
    upstream: https://openrouter.ai/api
    auth_header: Authorization
    auth_prefix: "Bearer "
    api_key_env: OPENROUTER_API_KEY

profiles:
  # render.sh approves the workspace tools the tape uses from this seat: the
  # demo starts on an empty store, and an empty store holds every remote tool
  # until an operator releases it (#469).
  ops:
    role: operator
    auth:
      bearer_token_env: TRENTINA_PROFILE_OPS_TOKEN
    llm_keys:
      openrouter:
        api_key_env: OPENROUTER_API_KEY
    backends:
      web:
        url: "internal://web"
        tools_allow: ["tool_pins_tool"]

  assistant:
    auth:
      bearer_token_env: TRENTINA_PROFILE_ASSISTANT_TOKEN
    llm_keys:                 # L3 for this profile's calls
      openrouter:
        api_key_env: OPENROUTER_API_KEY
    backends:
      web:
        url: "internal://web"
        tools_allow: ["fetch_tool", "quarantine_stats_tool"]
      workspace:
        url: "http://workspace:8000/mcp"
        tools_allow:
          - search_gmail_messages
          - get_gmail_message_content
          - draft_gmail_message
          - send_gmail_message
        parameter_guards:
          send_gmail_message:
            to: {allow: ["me@example.com"]}
            cc: {allow: ["me@example.com"]}
            bcc: {allow: ["me@example.com"]}
    defense:
      provider: openrouter
      model: google/gemini-3.5-flash-lite
      enforcement: block
      modes: [block, redact]
